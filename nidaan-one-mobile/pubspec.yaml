name: nidaan_one_mobile
description: "Nidaan One Patient Portal mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Styling & Icons
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

  # State Management & Cache
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Networking & Utilities
  dio: ^5.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
