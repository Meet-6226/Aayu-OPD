name: flutter_patient_app
description: "Apollo OPD Patient Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  dio: ^5.8.0+1
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  qr_flutter: ^4.1.0
  flutter_spinkit: ^5.2.1
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10+1

  # Location & Geocoding
  geolocator: ^13.0.4
  geocoding: ^3.0.0

  # Image capture & compression
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Audio recording & playback
  record: ^5.2.0
  audioplayers: ^6.1.0

  # Networking & WebSocket
  web_socket_channel: ^3.0.2

  # Storage & File access
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^11.4.0

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
